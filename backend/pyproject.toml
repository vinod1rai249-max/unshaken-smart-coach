[project]
name = "unshaken-smart-coach-backend"
version = "0.1.0"
description = "UNShaken Smart Coach backend: database migration tooling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
